
name: Terraform Azure Pipeline

on:
  workflow_dispatch:
  push:
    branches:
      - fetature1

permissions:
  contents: read

jobs:
  terraform:
    name: Terraform CI
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: a595f7b0-4bcf-4fba-a202-8242a2c74129
      ARM_TENANT_ID: e0303f1b-f8a0-4dba-a6d9-a2b2413518de
      ARM_SUBSCRIPTION_ID: b5bdd529-77ce-4d37-811b-46f7e60da7ab
      ARM_CLIENT_SECRET: -Zt8Q~HOYaUfgy0VfHUmFTaKIe76CcHV0d_Ibao1

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: |
            {
              "clientId": "a595f7b0-4bcf-4fba-a202-8242a2c74129",
              "clientSecret": "-Zt8Q~HOYaUfgy0VfHUmFTaKIe76CcHV0d_Ibao1",
              "tenantId": "e0303f1b-f8a0-4dba-a6d9-a2b2413518de",
              "subscriptionId": "b5bdd529-77ce-4d37-811b-46f7e60da7ab"
            }

      - name: Verify Azure Subscription
        run: az account show --query "{name:name, id:id, tenantId:tenantId}" -o table

      - name: Terraform Init
        working-directory: azurerm_resource_group
        run: terraform init

      - name: Terraform Format Check
        working-directory: azurerm_resource_group
        run: terraform fmt -check -recursive

      - name: Terraform Validate
        working-directory: azurerm_resource_group
        run: terraform validate

      - name: Terraform Plan
        working-directory: azurerm_resource_group
        run: terraform plan
