name: 'Terraform Feature Branch Plan'

on:
  push:
    branches:
      - fetature1

permissions:
  contents: read

jobs:
  terraform-plan:
    name: 'Azure Login and Terraform Plan'
    runs-on: ubuntu-latest

    env:
      ARM_CLIENT_ID: a595f7b0-4bcf-4fba-a202-8242a2c74129
      ARM_CLIENT_SECRET: GXL8Q~xohEkkC6i1K32fCVhVfbsjW~4xgHivwcu_
      ARM_TENANT_ID: e0303f1b-f8a0-4dba-a6d9-a2b2413518de
      ARM_SUBSCRIPTION_ID: b5bdd529-77ce-4d37-811b-46f7e60da7ab

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v3
        with:
          creds: '{"clientId":"a595f7b0-4bcf-4fba-a202-8242a2c74129","clientSecret":"GXL8Q~xohEkkC6i1K32fCVhVfbsjW~4xgHivwcu_","tenantId":"e0303f1b-f8a0-4dba-a6d9-a2b2413518de","subscriptionId":"b5bdd529-77ce-4d37-811b-46f7e60da7ab"}'

      - name: Verify Azure Subscription
        run: az account show --query "{name:name,id:id,tenantId:tenantId}" -o table

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: "1.14.0"

      - name: Terraform Format Check
        run: terraform fmt -check -recursive

      - name: Terraform Init
        run: terraform init

      - name: Terraform Validate
        run: terraform validate

      - name: Terraform Plan
        run: terraform plan -input=false