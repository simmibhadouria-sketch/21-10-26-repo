name: 'Terraform Feature Branch Plan'

on:
  push:
    branches:
      - fetature1 

permissions:
  id-token: write
  contents: read

jobs:
  terraform-plan:
    name: 'Azure Login and Terraform Plan'
    runs-on: ubuntu-latest

    env:
      # Azure Credentials Hardcoded
      ARM_CLIENT_ID: "a595f7b0-4bcf-4fba-a202-8242a2c74129"
      ARM_CLIENT_SECRET: "-Zt8Q~HOYaUfgy0VfHUmFTaKIe76CcHV0d_Ibao1"
      ARM_TENANT_ID: "e0303f1b-f8a0-4dba-a6d9-a2b2413518de"
      ARM_SUBSCRIPTION_ID: "b5bdd529-77ce-4d37-811b-46f7e60da7ab"

    steps:
    # 1. Repository Code Checkout
    - name: Checkout Code
      uses: actions/checkout@v4

    # 2. Azure CLI Login
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: '{"clientId":"a595f7b0-4bcf-4fba-a202-8242a2c74129","clientSecret":"-Zt8Q~HOYaUfgy0VfHUmFTaKIe76CcHV0d_Ibao1","tenantId":"e0303f1b-f8a0-4dba-a6d9-a2b2413518de","subscriptionId":"b5bdd529-77ce-4d37-811b-46f7e60da7ab"}'

    # 3. Setup Terraform CLI
    - name: Setup Terraform
      uses: hashicorp/setup-terraform@v3
      with:
        terraform_version: "latest"

    # 4. Terraform Init
    - name: Terraform Init
      run: terraform init

    # 5. Terraform Plan
    - name: Terraform Plan
      run: terraform plan
